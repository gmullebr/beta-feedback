<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Walrus Club Beta</title>
<style>
/* ------------------------------------------------------------------ *
 * Tokens. One accent colour, three muted badge colours, light + dark.
 * ------------------------------------------------------------------ */
:root {
  color-scheme: light dark;
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #16181d;
  --muted: #6b7280;
  --line: #e2e5ea;
  --line-strong: #cbd1d9;
  --accent: #2f6fed;
  --accent-text: #ffffff;
  --accent-soft: #e9f0ff;
  --bug: #b4460d;      --bug-bg: #fdf0e7;
  --idea: #0e6f67;     --idea-bg: #e6f5f3;
  --other: #4f5560;    --other-bg: #eef0f3;
  --danger: #b42318;
  --danger-bg: #b42318;
  --danger-fg: #ffffff;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1114;
    --card: #181b20;
    --text: #e7e9ed;
    --muted: #99a0aa;
    --line: #262a31;
    --line-strong: #363c45;
    --accent: #6f9bff;
    --accent-text: #0b0d10;
    --accent-soft: #1a2334;
    --bug: #ffa471;     --bug-bg: #2f1f12;
    --idea: #5fd3c4;    --idea-bg: #0e2a27;
    --other: #b4bac4;   --other-bg: #23262c;
    --danger: #ff8f85;
    --danger-bg: #ff8f85;
    --danger-fg: #2b0b08;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }

/* The hidden attribute only works because the browser's default stylesheet says
   [hidden] { display: none }. Any rule of ours that sets display on the same
   element outranks it and the element comes back. This puts it beyond reach. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  /* Nothing may scroll sideways at 375px.
     This is "clip", not "hidden", on purpose. overflow-x: hidden forces the other
     axis to compute as auto, which turns the element into a scroll container, and
     position: sticky then anchors to that container instead of the viewport. The
     sticky toolbar silently stops sticking. "clip" clips without creating one. */
  overflow-x: clip;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px 48px;
}

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ------------------------------------------------------------------ *
 * Header
 * ------------------------------------------------------------------ */
header.page { padding: 20px 0 12px; }
header.page h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }

/* ------------------------------------------------------------------ *
 * Sticky toolbar: the Report button is always within reach.
 * ------------------------------------------------------------------ */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 8px 0 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}

.btn-primary {
  display: block;
  width: 100%;
  min-height: 46px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--accent-text);
  font-size: 16px;
  font-weight: 600;
}
.btn-primary:active { filter: brightness(.94); }
.btn-primary:disabled { opacity: .5; cursor: default; }

.row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
}
.row.between { justify-content: space-between; }

.chip {
  flex: 0 0 auto;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.3;
}
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  overflow: hidden;
  background: var(--card);
}
.segmented button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  padding: 6px 10px;
}
.segmented button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.btn-quiet {
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  font-size: 13px;
  padding: 6px 11px;
}
.btn-quiet:disabled { opacity: .55; cursor: default; }

/* ------------------------------------------------------------------ *
 * List
 * ------------------------------------------------------------------ */
.state {
  padding: 28px 4px;
  color: var(--muted);
  font-size: 15px;
  text-align: center;
}
.state.error { color: var(--danger); }
.state code {
  display: inline-block;
  margin-top: 6px;
  font-size: 12px;
  word-break: break-all;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 13px 14px 11px;
  margin-bottom: 10px;
}

.card-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 7px;
}
.rid { font-size: 13px; font-weight: 600; color: var(--muted); }
.badge {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: .01em;
}
.badge.bug   { background: var(--bug-bg);   color: var(--bug); }
.badge.idea  { background: var(--idea-bg);  color: var(--idea); }
.badge.other { background: var(--other-bg); color: var(--other); }
.level { font-size: 12.5px; color: var(--muted); }

.card .text {
  margin: 0 0 9px;
  white-space: pre-wrap;        /* newlines as typed */
  overflow-wrap: anywhere;      /* a pasted URL must not widen the page */
  font-size: 15px;
}

/* Screenshots on a card. max-width matters more than it looks: a tall narrow
   phone screenshot is fine, but a wide one scaled to 96px high would otherwise
   be several hundred pixels across and push the card past 375px. */
.shots {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 10px;
}
.shots a { display: block; line-height: 0; }
.shots img {
  height: 96px;
  width: auto;
  max-width: 140px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
}

.meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }

.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* The Me too control is a pill with a border so it reads as tappable,
   and fills in when this phone's name has voted. */
.metoo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 13px;
  border: 1.5px solid var(--line-strong);
  border-radius: 999px;
  background: var(--card);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
}
.metoo .count {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-weight: 600;
}
.metoo[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}
.metoo[aria-pressed="true"] .count { color: var(--accent-text); opacity: .85; }
.metoo:active { transform: scale(.97); }
.metoo:disabled { opacity: .6; }

.link-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 13px;
  padding: 8px 4px;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.link-btn.danger { color: var(--danger); }
.spacer { flex: 1 1 auto; }

/* ------------------------------------------------------------------ *
 * Bottom sheet
 * ------------------------------------------------------------------ */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 40;
}
.backdrop[hidden], .sheet[hidden] { display: none; }

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: var(--card);
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--line);
  max-height: 92vh;
  overflow-y: auto;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .metoo:active { transform: none; } }
@media (min-width: 680px) {
  .sheet {
    left: 50%; right: auto; bottom: 0;
    transform: translateX(-50%);
    width: 620px;
    border-radius: 16px 16px 0 0;
  }
  @keyframes rise { from { transform: translateX(-50%) translateY(14px); opacity: .6; } to { transform: translateX(-50%); opacity: 1; } }
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.sheet-head h2 { margin: 0; font-size: 17px; }

fieldset { border: 0; margin: 14px 0 0; padding: 0; }
legend, .field-label {
  padding: 0;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 7px;
  display: block;
}

.seg-big { display: flex; gap: 8px; }
.seg-big button {
  flex: 1 1 0;
  min-height: 46px;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}
.seg-big button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.levels { display: flex; flex-direction: column; gap: 7px; }
.levels button {
  text-align: left;
  min-height: 42px;
  padding: 8px 12px;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text);
  font-size: 14.5px;
}
.levels button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

input[type="text"], textarea {
  width: 100%;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 11px 12px;
  font-size: 16px;            /* 16px keeps iOS from zooming on focus */
}
input[type="text"]:disabled { opacity: .7; }
textarea { min-height: 116px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sub-link {
  display: inline-block;
  margin-top: 6px;
  font-size: 12.5px;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 4px 0;
  text-decoration: underline;
}

/* Screenshot picker in the form. The previews are smaller than the card's,
   because here they only have to confirm "yes, that is the screen I meant". */
.pics {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}
.pic { position: relative; line-height: 0; }
.pic img {
  height: 72px;
  width: auto;
  max-width: 110px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--bg);
}
.pic .drop {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  line-height: 1;
  padding: 0;
  box-shadow: var(--shadow);
}

.form-error {
  margin: 12px 0 0;
  color: var(--danger);
  font-size: 13.5px;
}
.sheet .btn-primary { margin-top: 16px; }

/* ------------------------------------------------------------------ *
 * Confirm dialog
 * ------------------------------------------------------------------ */
.confirm {
  position: fixed;
  z-index: 60;
  left: 16px; right: 16px;
  top: 50%;
  transform: translateY(-50%);
  max-width: 340px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 12px 32px rgba(0,0,0,.28);
}
.confirm[hidden] { display: none; }
.confirm p { margin: 0 0 16px; font-size: 15px; }
.confirm .buttons { display: flex; gap: 8px; }
.confirm .buttons button {
  flex: 1 1 0;
  min-height: 44px;
  border-radius: var(--radius);
  border: 1.5px solid var(--line-strong);
  background: var(--card);
  font-size: 15px;
  font-weight: 600;
}
.confirm .buttons .destroy {
  background: var(--danger-bg);
  border-color: var(--danger-bg);
  color: var(--danger-fg);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <h1>Walrus Club Beta</h1>
  </header>

  <div class="toolbar">
    <button type="button" id="openForm" class="btn-primary">Report something</button>

    <div class="row" id="filters" role="group" aria-label="Filter by type">
      <button type="button" class="chip" data-filter="all"   aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="bug"   aria-pressed="false">Bug</button>
      <button type="button" class="chip" data-filter="idea"  aria-pressed="false">Idea</button>
      <button type="button" class="chip" data-filter="other" aria-pressed="false">Other</button>
    </div>

    <div class="row between">
      <div class="segmented" id="sorts" role="group" aria-label="Sort">
        <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
        <button type="button" data-sort="votes"  aria-pressed="false">Most voted</button>
      </div>
      <button type="button" id="refresh" class="btn-quiet">Refresh</button>
    </div>
  </div>

  <main id="list" aria-live="polite"></main>
</div>

<!-- Report / edit sheet -->
<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle">Report something</h2>
    <button type="button" id="closeSheet" class="link-btn">Close</button>
  </div>

  <form id="form" novalidate>
    <fieldset>
      <legend>What is it?</legend>
      <div class="seg-big" id="typePicker">
        <button type="button" data-type="bug"   aria-pressed="false">Bug</button>
        <button type="button" data-type="idea"  aria-pressed="false">Idea</button>
        <button type="button" data-type="other" aria-pressed="false">Other</button>
      </div>
    </fieldset>

    <fieldset id="levelBlock" hidden>
      <legend id="levelLabel">How bad is it?</legend>
      <div class="levels" id="levelPicker"></div>
    </fieldset>

    <fieldset>
      <label class="field-label" for="nameInput">Your name</label>
      <input type="text" id="nameInput" autocomplete="name" enterkeyhint="next" placeholder="e.g. Anna">
      <button type="button" id="changeName" class="sub-link" hidden>Not you? Change name</button>
    </fieldset>

    <fieldset>
      <label class="field-label" for="textInput">Tell us</label>
      <textarea id="textInput" placeholder="Pick a type first."></textarea>
    </fieldset>

    <fieldset>
      <span class="field-label">Screenshots</span>
      <!-- The real file input is kept off screen and opened by the button next to
           it. A browser will not let us restyle the native "Choose file" control,
           and it looks nothing like the rest of the form. sr-only rather than
           hidden, because some browsers refuse to open a picker for an input that
           is display:none. -->
      <input type="file" id="picInput" class="sr-only" accept="image/*" multiple tabindex="-1" aria-hidden="true">
      <button type="button" id="addPic" class="btn-quiet">Add a screenshot</button>
      <div class="pics" id="picList"></div>
    </fieldset>

    <p id="formError" class="form-error" hidden></p>

    <button type="submit" id="submitBtn" class="btn-primary" disabled>Send</button>
  </form>
</section>

<!-- Delete confirmation -->
<div id="confirmBackdrop" class="backdrop" hidden></div>
<div id="confirm" class="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
  <p id="confirmText">Delete this report?</p>
  <div class="buttons">
    <button type="button" id="confirmCancel">Cancel</button>
    <button type="button" id="confirmDelete" class="destroy">Delete</button>
  </div>
</div>

<script>
'use strict';

/* ==================================================================== *
 * The only line that changes between "built" and "live".
 * Paste the Apps Script web app URL here (README, step 5).
 * It is not a secret: this page is public anyway.
 * ==================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzgx5avg1EqMtEdkbeKZeDdKmAfYGuTlBvIhoJwSEBLSjztDIxB7Pj2QxdiRSqwDEG2lA/exec';

var NAME_KEY = 'wcb.name';

var LEVELS = {
  bug: {
    label: 'How bad is it?',
    options: [
      { value: 'blocker',  wording: "Can't continue" },
      { value: 'annoying', wording: 'Annoying, I worked around it' },
      { value: 'cosmetic', wording: 'Cosmetic' }
    ]
  },
  idea: {
    label: 'How much does it matter?',
    options: [
      { value: 'must',  wording: 'Must have' },
      { value: 'nice',  wording: 'Nice to have' },
      { value: 'maybe', wording: 'Just an idea' }
    ]
  },
  other: { label: '', options: [] }
};

var PLACEHOLDERS = {
  bug: 'What happened, what did you expect, and on which screen?',
  idea: 'What would you like, and why?',
  other: 'Anything else on your mind.'
};

var TYPE_WORDING = { bug: 'Bug', idea: 'Idea', other: 'Other' };
var TYPE_LETTER  = { bug: 'B', idea: 'I', other: 'O' };

/*
 * Reports carry one global number, and the letter in front of it is derived from
 * the type rather than stored. Nothing extra goes in the Sheet, and the number
 * stays unique even when someone edits a Bug into an Idea. The letter can go
 * stale on an edited report; the number it is attached to never does, so a "#B14"
 * posted in WhatsApp always still finds report 14.
 */
function reportRef(report) { return (TYPE_LETTER[report.type] || '') + report.id; }
function reportLabel(report) { return '#' + reportRef(report); }

function findReport(id) {
  for (var i = 0; i < state.reports.length; i++) {
    if (state.reports[i].id === id) return state.reports[i];
  }
  return null;
}

var state = {
  reports: [],
  filter: 'all',
  sort: 'newest',
  name: '',
  status: 'loading',   // loading | ready | error
  errorText: '',
  editingId: null,
  type: null,
  level: null,
  images: [],          // what the form will send: new pictures, or kept Drive ids
  sending: false,
  pendingDeleteId: null,
  loading: false,      // a fetch is in flight, so do not start another
  slowLoad: false,     // the first load is dragging, so say so rather than look broken
  transientError: false,  // Google had a moment, as opposed to a real failure
  lastLoadedAt: 0      // when the list last arrived, for the staleness check
};

var $ = function (id) { return document.getElementById(id); };


/* ==================================================================== *
 * Remembered name. Private browsing can make localStorage throw on
 * access, not just return null, so every touch is wrapped.
 * ==================================================================== */
function loadName() {
  try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; }
}
function saveName(name) {
  try { localStorage.setItem(NAME_KEY, name); } catch (e) { /* private browsing: just forget */ }
}
function forgetName() {
  try { localStorage.removeItem(NAME_KEY); } catch (e) {}
}
/*
 * Apps Script answers in anything from three to eighteen seconds, and none of
 * that is ours to fix. So the last list we saw is kept on the phone and drawn
 * the instant the page opens, while the real one is fetched behind it. A tester
 * who has opened this before never watches a spinner again; they see the list
 * and it quietly corrects itself a few seconds later.
 *
 * This is only ever a copy of data the page just fetched, so the worst case is
 * a list that is a few seconds stale for a few seconds.
 */
var CACHE_KEY = 'wcb.cache';
var CACHE_MAX_AGE_MS = 604800000;   // a week; older than that, start clean

function loadCachedReports() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.savedAt || !parsed.reports) return null;
    if (Date.now() - parsed.savedAt > CACHE_MAX_AGE_MS) return null;
    return parsed.reports;
  } catch (e) { return null; }
}

function saveCachedReports(reports) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), reports: reports }));
  } catch (e) { /* private browsing, or full: the page works without it */ }
}

function sameName(a, b) {
  return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
}


/* ==================================================================== *
 * Device, guessed from the user agent. Silent, per decision 11.
 * ==================================================================== */
function detectDevice() {
  var ua = navigator.userAgent || '';
  if (/iPhone|iPod/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  // iPadOS 13+ pretends to be a Mac. A Mac with touch points is an iPad.
  if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Macintosh|Mac OS X/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows';
  return 'Other';
}


/* ==================================================================== *
 * Screenshots (decisions 27 to 31)
 * ==================================================================== */
var MAX_IMAGES = 2;
var MAX_IMAGE_EDGE = 1280;
var IMAGE_QUALITY = 0.8;

/*
 * The two Google endpoints that serve a publicly shared Drive image without a
 * login. They are the first thing to check if pictures stop showing: they are
 * Google's URLs, not ours, and if Google changes them nothing in the door or the
 * Sheet will look wrong, only these two lines.
 *
 * thumbnail: small and fast, what the card shows.
 * lh3: the full-size file, what opens when a thumbnail is tapped.
 */
function thumbUrl(id) {
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w400';
}
function fullUrl(id) {
  return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id);
}

/*
 * A phone screenshot straight off the camera roll is 2 to 5 MB. Two of those in
 * one POST would make Send take the better part of a minute on mobile data, and
 * the door refuses anything over its size cap anyway. So each picture is redrawn
 * at 1280 px on its long side and re-encoded as JPEG here, on the phone, which
 * lands at roughly 150 KB and is still perfectly readable for a bug report.
 *
 * Never upscaled: enlarging a small picture makes a bigger file out of the same
 * detail, which is all cost and no gain.
 *
 * This happens when the file is picked, not when Send is tapped, so the wait sits
 * where the tester is already choosing something rather than in front of Send.
 */
function shrinkImage(file) {
  return decodeImage(file).then(function (source) {
    var scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(source.width, source.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(source.width * scale));
    canvas.height = Math.max(1, Math.round(source.height * scale));
    canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
    if (source.close) source.close();     // an ImageBitmap holds memory until released

    // toDataURL gives "data:image/jpeg;base64,AAAA". The door wants the part
    // after the comma, and the whole string doubles as the preview's src.
    var url = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);
    return { mime: 'image/jpeg', data: url.slice(url.indexOf(',') + 1), previewUrl: url };
  });
}

/* createImageBitmap is the direct route and decodes off the main thread. Older
   Safari does not have it for files, so fall back to an <img> on a blob URL. */
function decodeImage(file) {
  if (typeof createImageBitmap === 'function') return createImageBitmap(file);
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

/*
 * state.images holds what the form will send. Two shapes, one list:
 * on create, { mime, data, previewUrl } for a picture picked just now; on edit,
 * { id, previewUrl } for one already in Drive. The payload builder tells them
 * apart by which mode the form is in, so everything else here can ignore it.
 */
function addPickedFiles(files) {
  var room = MAX_IMAGES - state.images.length;
  if (room <= 0) {
    showFormError('Two screenshots is the limit.');
    return;
  }
  var chosen = [];
  for (var i = 0; i < files.length && chosen.length < room; i++) chosen.push(files[i]);
  if (files.length > chosen.length) showFormError('Two screenshots is the limit.');

  // One at a time: shrinking is the heavy bit, and doing both at once on a phone
  // just makes them both slow. Also keeps the previews in the order picked.
  var chain = Promise.resolve();
  for (var c = 0; c < chosen.length; c++) {
    chain = chain.then(shrinkThen(chosen[c]));
  }
}

function shrinkThen(file) {
  return function () {
    return shrinkImage(file).then(function (item) {
      if (state.images.length < MAX_IMAGES) state.images.push(item);
      renderImages();
    }, function () {
      // A file the browser cannot decode (an unusual HEIC, a corrupt download)
      // is dropped with one line. The rest of the form stays exactly as it was.
      showFormError("Couldn't read that image.");
    });
  };
}

function renderImages() {
  var row = $('picList');
  row.textContent = '';

  for (var i = 0; i < state.images.length; i++) {
    var box = el('div', 'pic');
    var img = document.createElement('img');
    img.src = state.images[i].previewUrl;
    img.alt = 'Screenshot ' + (i + 1);
    box.appendChild(img);

    var drop = el('button', 'drop', '×');
    drop.type = 'button';
    drop.setAttribute('data-drop', String(i));
    drop.setAttribute('aria-label', 'Remove screenshot ' + (i + 1));
    box.appendChild(drop);

    row.appendChild(box);
  }

  // Decision 30: on edit a picture can be removed but not added, so the button
  // is not offered there at all. Forgot one? Delete the report and post again.
  var add = $('addPic');
  add.hidden = !!state.editingId || state.images.length >= MAX_IMAGES;
  add.textContent = state.images.length ? 'Add another' : 'Add a screenshot';
}


/* ==================================================================== *
 * Talking to the door
 * ==================================================================== */
function apiConfigured() {
  return API_URL.indexOf('PASTE_THE') === -1 && /^https?:\/\//.test(API_URL);
}

/*
 * fetch has no timeout of its own. A request that stalls on a phone, which is
 * ordinary on mobile data, never resolves and never rejects, so any flag we set
 * before it stays set for ever. That is what wedged the page on "Loading…" and
 * "Sending…". Every call now has a deadline, so the promise always settles and
 * the flags always clear.
 */
var READ_TIMEOUT_MS = 60000;
var WRITE_TIMEOUT_MS = 60000;

function fetchWithTimeout(options, ms) {
  if (typeof AbortController === 'undefined') return fetch(API_URL, options);
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, ms);
  options.signal = controller.signal;
  return fetch(API_URL, options).then(
    function (res) { clearTimeout(timer); return res; },
    function (err) { clearTimeout(timer); throw err; }
  );
}

/*
 * Apps Script does not always answer with JSON. When it is rate limiting or
 * briefly unwell it returns one of Google's HTML error pages, and res.json()
 * then throws. Safari words that as "The string did not match the expected
 * pattern", which tells a tester nothing and reads like our bug.
 *
 * So take the body as text and parse it ourselves. A body that is not JSON is
 * Google having a moment rather than a real answer, and it is marked transient
 * so the caller knows it is worth asking again.
 */
function readBody(res) {
  return res.text().then(function (body) {
    try {
      return JSON.parse(body);
    } catch (e) {
      var err = new Error('Google answered with a page instead of data.');
      err.transient = true;
      throw err;
    }
  });
}

/*
 * Reads are safe to repeat, so a transient answer is retried rather than shown
 * to anybody. Writes are not retried here: a create that actually landed would
 * be posted twice, which findAlreadyLanded exists to sort out instead.
 *
 * A request that hit its own deadline is not retried either. It has already
 * taken a minute, and asking again only makes the tester wait two.
 */
function withRetry(attempt, triesLeft, delayMs) {
  return attempt().catch(function (err) {
    if (triesLeft <= 1) throw err;
    if (err && err.name === 'AbortError') throw err;
    return new Promise(function (resolve) { setTimeout(resolve, delayMs); })
      .then(function () { return withRetry(attempt, triesLeft - 1, delayMs * 2); });
  });
}

function apiGet() {
  return withRetry(function () {
    return fetchWithTimeout({ method: 'GET' }, READ_TIMEOUT_MS)
      .then(readBody)
      .then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || 'The store said no.');
        return data.reports || [];
      });
  }, 3, 1200);
}

/*
 * The POST goes out as text/plain on purpose.
 * A JSON content type makes the browser send a preflight OPTIONS request first,
 * and Apps Script does not answer those, so the call fails before it starts.
 * text/plain is on the CORS safelist, so the browser sends the POST directly and
 * the script parses the body string itself.
 * mode is left alone: 'no-cors' would make the response body unreadable, and the
 * default redirect handling is what follows Apps Script's redirect to its CDN.
 */
function apiPost(payload) {
  return fetchWithTimeout({
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }, WRITE_TIMEOUT_MS)
    .then(readBody)
    .then(function (data) {
      if (!data || !data.ok) throw new Error((data && data.error) || 'The store said no.');
      return data;
    });
}


/* ==================================================================== *
 * Loading the list
 * ==================================================================== */
function refresh() {
  if (!apiConfigured()) {
    state.status = 'error';
    state.errorText = 'setup';
    render();
    return Promise.resolve();
  }
  if (state.loading) return Promise.resolve();
  state.loading = true;
  $('refresh').disabled = true;

  // Only when there is nothing on screen yet. A cached list is already showing,
  // so a slow background refresh needs no explanation.
  var slowTimer = null;
  if (state.reports.length === 0) {
    state.slowLoad = false;
    slowTimer = setTimeout(function () {
      if (state.loading) { state.slowLoad = true; render(); }
    }, 6000);
  }
  return apiGet()
    .then(function (reports) {
      state.reports = reports;
      state.status = 'ready';
      state.errorText = '';
      state.lastLoadedAt = Date.now();
      saveCachedReports(reports);
    })
    .catch(function (err) {
      // Only take over the screen when there is nothing to show. If reports are
      // already on screen, a failed background refresh leaves them alone rather
      // than replacing a working list with an error.
      if (state.reports.length === 0) {
        state.status = 'error';
        state.errorText = err.message || String(err);
        state.transientError = !!(err && err.transient);
      }
    })
    .then(function () {
      if (slowTimer) clearTimeout(slowTimer);
      state.loading = false;
      state.slowLoad = false;
      $('refresh').disabled = false;
      render();
    });
}

/*
 * The list is fetched once when the page opens. On a phone that single request
 * fails for dull reasons: the screen was locked, wifi handed over to mobile
 * data, the tab was frozen in the background. Without this the tester is left
 * looking at the error line until they notice the Refresh button, which on a
 * first visit is a good way to lose them.
 *
 * The browser already says when the page comes back into view and when the
 * network returns, so we simply ask again. Only reads are retried. A failed
 * post is left alone deliberately, because resending it without being asked
 * could double-post; the form keeps the text so a retry is one tap.
 */
var STALE_AFTER_MS = 120000;

function autoRefresh() {
  if (document.visibilityState !== 'visible') return;
  if (state.sending || state.loading) return;
  var stale = !state.lastLoadedAt || (Date.now() - state.lastLoadedAt) > STALE_AFTER_MS;
  if (state.status === 'error' || stale) refresh();
}


/* ==================================================================== *
 * Rendering
 * ==================================================================== */
function relativeTime(iso) {
  var then = new Date(iso).getTime();
  if (!then || isNaN(then)) return '';
  var secs = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (secs < 60) return 'just now';
  var mins = Math.round(secs / 60);
  if (mins < 60) return mins + ' min ago';
  var hours = Math.round(mins / 60);
  if (hours < 24) return hours + ' h ago';
  var days = Math.round(hours / 24);
  if (days < 7) return days + ' d ago';
  return new Date(then).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

function levelWording(type, level) {
  var group = LEVELS[type];
  if (!group || !level) return '';
  for (var i = 0; i < group.options.length; i++) {
    if (group.options[i].value === level) return group.options[i].wording;
  }
  return '';
}

function visibleReports() {
  var list = state.reports.slice();
  if (state.filter !== 'all') {
    list = list.filter(function (r) { return r.type === state.filter; });
  }
  if (state.sort === 'votes') {
    list.sort(function (a, b) { return (b.votes - a.votes) || (b.id - a.id); });
  } else {
    list.sort(function (a, b) { return b.id - a.id; });
  }
  return list;
}

/* Every piece of tester text goes in with textContent, never innerHTML.
   Someone posting "<img onerror=...>" should read as those characters, not run. */
function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function stateLine(message, isError, detail) {
  var p = el('p', 'state' + (isError ? ' error' : ''), message);
  if (detail) {
    p.appendChild(document.createElement('br'));
    p.appendChild(el('code', null, detail));
  }
  return p;
}

/*
 * A write already returns the row the script wrote, so there is no reason to
 * spend another three-second round trip asking for the whole list before showing
 * it. Apply it here, paint immediately, and let a background refresh pick up
 * whatever other people posted.
 */
function applyReportLocally(report) {
  for (var i = 0; i < state.reports.length; i++) {
    if (state.reports[i].id === report.id) {
      // An edit response carries no vote data, so keep what we already had.
      if (report.votes === undefined) report.votes = state.reports[i].votes;
      if (!report.voters) report.voters = state.reports[i].voters;
      if (!report.images) report.images = state.reports[i].images || [];
      state.reports[i] = report;
      return;
    }
  }
  if (report.votes === undefined) report.votes = 0;
  if (!report.voters) report.voters = [];
  if (!report.images) report.images = [];
  state.reports.push(report);
}

function removeReportLocally(id) {
  state.reports = state.reports.filter(function (r) { return r.id !== id; });
}

/*
 * The write reached the Sheet but the answer never came back. Retrying blindly
 * posts the report twice, which is exactly what happened in testing. So before
 * telling anyone it failed, go and look: if a report with the same name and the
 * same text turned up in the last ten minutes, it landed and we simply did not
 * hear about it.
 */
function findAlreadyLanded(name, text) {
  return apiGet().then(function (reports) { return findCreated(reports, name, text); });
}

function findCreated(reports, name, text) {
  var wanted = String(text).trim();
  var cutoff = Date.now() - 600000;
  for (var i = 0; i < reports.length; i++) {
    var r = reports[i];
    if (sameName(r.name, name) && r.text === wanted &&
        new Date(r.created_at).getTime() >= cutoff) return r;
  }
  return null;
}

/* An edit has landed when the row now says what we asked it to say. */
function findEdited(reports, payload) {
  for (var i = 0; i < reports.length; i++) {
    var r = reports[i];
    if (r.id !== payload.id) continue;
    var same = r.type === payload.type && (r.level || '') === (payload.level || '') &&
      r.text === String(payload.text).trim() &&
      (r.images || []).join(',') === (payload.images || []).join(',');
    return same ? r : null;
  }
  return null;
}

function render() {
  var list = $('list');
  list.textContent = '';

  if (state.status === 'loading') {
    list.appendChild(stateLine(
      state.slowLoad ? 'Still loading. This can take a moment the first time.' : 'Loading…',
      false));
    return;
  }

  if (state.status === 'error') {
    if (state.errorText === 'setup') {
      list.appendChild(stateLine(
        'Not connected yet. Paste the Apps Script web app URL into API_URL at the top of index.html.',
        true));
    } else {
      list.appendChild(stateLine(
        state.transientError
          ? 'Google is being slow right now. Tap Refresh to try again.'
          : "Couldn't load the list. Check your connection and tap Refresh.",
        true, state.transientError ? null : state.errorText));
    }
    return;
  }

  var reports = visibleReports();

  if (reports.length === 0) {
    if (state.reports.length === 0) {
      list.appendChild(stateLine('Nothing here yet. Be the first to report something.', false));
    } else {
      list.appendChild(stateLine('No ' + TYPE_WORDING[state.filter].toLowerCase() +
        ' reports yet. Try another filter.', false));
    }
    return;
  }

  for (var i = 0; i < reports.length; i++) {
    list.appendChild(card(reports[i]));
  }
}

function card(r) {
  var article = el('article', 'card');
  article.setAttribute('data-id', String(r.id));

  var top = el('div', 'card-top');
  top.appendChild(el('span', 'rid', reportLabel(r)));
  top.appendChild(el('span', 'badge ' + r.type, TYPE_WORDING[r.type] || r.type));
  var wording = levelWording(r.type, r.level);
  if (wording) top.appendChild(el('span', 'level', wording));
  article.appendChild(top);

  article.appendChild(el('p', 'text', r.text));

  // Rows written before screenshots existed have no images field at all, so this
  // has to cope with undefined, not just an empty list.
  var shots = r.images || [];
  if (shots.length) article.appendChild(thumbRow(shots));

  // Device is deliberately not shown. It is still captured silently and still
  // written to the Sheet, where the operator can use it to spot an iPhone-only
  // bug, but testers have no reason to see what phone anyone else is on.
  article.appendChild(el('div', 'meta', r.name + ' · ' + relativeTime(r.created_at)));

  var actions = el('div', 'card-actions');

  var voted = state.name && (r.voters || []).some(function (v) { return sameName(v, state.name); });
  var vote = el('button', 'metoo');
  vote.type = 'button';
  vote.setAttribute('aria-pressed', voted ? 'true' : 'false');
  vote.setAttribute('data-vote', String(r.id));
  vote.appendChild(el('span', null, voted ? 'Me too' : 'Me too'));
  vote.appendChild(el('span', 'count', String(r.votes || 0)));
  vote.setAttribute('aria-label', (voted ? 'Remove your me too from' : 'Me too on') +
    ' report ' + reportRef(r) + ', ' + (r.votes || 0) + ' so far');
  actions.appendChild(vote);

  if (state.name && sameName(r.name, state.name)) {
    actions.appendChild(el('span', 'spacer'));
    var edit = el('button', 'link-btn', 'Edit');
    edit.type = 'button';
    edit.setAttribute('data-edit', String(r.id));
    actions.appendChild(edit);

    var del = el('button', 'link-btn danger', 'Delete');
    del.type = 'button';
    del.setAttribute('data-delete', String(r.id));
    actions.appendChild(del);
  }

  article.appendChild(actions);
  return article;
}

/*
 * Thumbnails open the full image in a new tab rather than a lightbox: the phone's
 * own image viewer already pinches, zooms and saves, and writing a worse version
 * of that is not worth the code. loading="lazy" keeps a long list from fetching
 * twenty pictures nobody has scrolled to yet.
 */
function thumbRow(ids) {
  var row = el('div', 'shots');
  for (var i = 0; i < ids.length; i++) {
    var link = document.createElement('a');
    link.href = fullUrl(ids[i]);
    link.target = '_blank';
    link.rel = 'noopener';     // the opened tab must not get a handle on this one

    var img = document.createElement('img');
    img.src = thumbUrl(ids[i]);
    img.loading = 'lazy';
    img.alt = 'Screenshot';
    link.appendChild(img);

    row.appendChild(link);
  }
  return row;
}


/* ==================================================================== *
 * The sheet
 * ==================================================================== */
function renderLevels() {
  var block = $('levelBlock');
  var picker = $('levelPicker');
  picker.textContent = '';

  if (!state.type || LEVELS[state.type].options.length === 0) {
    block.hidden = true;               // no type picked yet, or "Other"
    return;
  }

  $('levelLabel').textContent = LEVELS[state.type].label;
  var options = LEVELS[state.type].options;
  for (var i = 0; i < options.length; i++) {
    var b = el('button', null, options[i].wording);
    b.type = 'button';
    b.setAttribute('data-level', options[i].value);
    b.setAttribute('aria-pressed', state.level === options[i].value ? 'true' : 'false');
    picker.appendChild(b);
  }
  block.hidden = false;
}

function syncTypeButtons() {
  var buttons = $('typePicker').querySelectorAll('button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].setAttribute('aria-pressed',
      buttons[i].getAttribute('data-type') === state.type ? 'true' : 'false');
  }
  $('textInput').placeholder = state.type ? PLACEHOLDERS[state.type] : 'Pick a type first.';
}

function formValid() {
  if (!state.type) return false;
  if (LEVELS[state.type].options.length > 0 && !state.level) return false;
  if (!$('nameInput').value.trim()) return false;
  if (!$('textInput').value.trim()) return false;
  return true;
}

function syncSubmit() {
  $('submitBtn').disabled = state.sending || !formValid();
}

function openSheet(report) {
  state.editingId = report ? report.id : null;
  state.type = report ? report.type : null;
  state.level = report ? (report.level || null) : null;
  state.sending = false;

  // On edit the form starts from the pictures the report already has, shown from
  // Drive. On a new report it starts empty.
  state.images = [];
  var existing = report ? (report.images || []) : [];
  for (var i = 0; i < existing.length; i++) {
    state.images.push({ id: existing[i], previewUrl: thumbUrl(existing[i]) });
  }

  $('sheetTitle').textContent = report ? ('Edit ' + reportLabel(report)) : 'Report something';
  $('submitBtn').textContent = report ? 'Save' : 'Send';
  $('textInput').value = report ? report.text : '';
  $('formError').hidden = true;

  var nameInput = $('nameInput');
  if (report) {
    // Name is what ties a report to its author, so editing cannot change it.
    nameInput.value = report.name;
    nameInput.disabled = true;
    $('changeName').hidden = true;
  } else {
    nameInput.value = state.name || '';
    nameInput.disabled = false;
    $('changeName').hidden = !state.name;
  }

  syncTypeButtons();
  renderLevels();
  renderImages();
  syncSubmit();

  $('backdrop').hidden = false;
  $('sheet').hidden = false;
  document.body.style.overflow = 'hidden';

  if (!report && !state.name) nameInput.focus();
}

function closeSheet() {
  $('sheet').hidden = true;
  $('backdrop').hidden = true;
  document.body.style.overflow = '';
  state.editingId = null;
  state.sending = false;
  // Pictures are per-sheet. Leaving them behind would attach the last report's
  // screenshots to the next one, and each one holds a base64 copy in memory.
  state.images = [];
  $('picInput').value = '';
}

function showFormError(message) {
  var line = $('formError');
  line.textContent = message;
  line.hidden = false;
}

function submitForm(event) {
  event.preventDefault();
  if (!formValid() || state.sending) return;

  var name = $('nameInput').value.trim();
  var text = $('textInput').value;

  state.sending = true;
  $('submitBtn').disabled = true;
  $('submitBtn').textContent = state.editingId ? 'Saving…' : 'Sending…';
  $('formError').hidden = true;

  /*
   * The same list, sent two ways. On create it carries the pictures themselves,
   * base64, in this one request (decision 29): a second request for the pictures
   * would mean a report whose screenshot never arrived, which is a failure state
   * nobody could fix from the page. On edit it carries only the ids still wanted,
   * and the door refuses anything that is not already on the row.
   */
  var images = [];
  for (var i = 0; i < state.images.length; i++) {
    var item = state.images[i];
    images.push(state.editingId ? item.id : { mime: item.mime, data: item.data });
  }

  var payload = state.editingId
    ? { action: 'update', id: state.editingId, name: name, type: state.type,
        level: state.level || '', text: text, images: images }
    : { action: 'create', name: name, type: state.type, level: state.level || '',
        text: text, device: detectDevice(), images: images };

  var wasCreate = !state.editingId;

  function settle(report) {
    state.name = name;
    saveName(name);
    closeSheet();
    if (report) applyReportLocally(report);
    if (wasCreate) {
      // The new report has to be visible, so drop back to the view that shows it.
      state.filter = 'all';
      state.sort = 'newest';
      syncToolbar();
    }
    render();
    saveCachedReports(state.reports);
    if (wasCreate) window.scrollTo({ top: 0, behavior: 'auto' });
    // Deliberately no refresh here. The response already told us what was
    // written, and this endpoint gets slower the more it is called, so spending
    // another three-to-eighteen-second request purely to discover other
    // people's posts is a bad trade. The next time the page is opened, or
    // Refresh is tapped, picks those up.
  }

  function fail() {
    // The sheet stays open and the typed text is untouched, so a retry is one tap.
    state.sending = false;
    $('submitBtn').textContent = state.editingId ? 'Save' : 'Send';
    syncSubmit();
    showFormError("Couldn't send. Check your connection and try again.");
  }

  /*
   * Apps Script hands a POST answer back through a redirect to a holding page.
   * When the door is slow, twenty seconds or more, that page is sometimes gone
   * by the time the browser gets there: Google either answers 404 (readBody
   * marks that transient) or bounces the browser back to the door as a plain
   * GET, so the answer arrives as the whole list instead of one report. In both
   * cases the write itself has almost always landed, and telling the tester it
   * failed would be wrong. So: a list is taken as the fresh truth and searched;
   * anything else triggers one re-read and the same search.
   */
  function landedIn(reports) {
    return wasCreate ? findCreated(reports, name, text) : findEdited(reports, payload);
  }

  apiPost(payload)
    .then(function (data) {
      if (data.reports) {
        state.reports = data.reports;
        var landed = landedIn(data.reports);
        if (landed) settle(landed); else fail();
        return;
      }
      settle(data.report);
    })
    .catch(function () {
      $('submitBtn').textContent = 'Checking…';
      apiGet()
        .then(function (reports) {
          var landed = landedIn(reports);
          if (landed) { state.reports = reports; settle(landed); } else fail();
        })
        .catch(fail);
    });
}


/* ==================================================================== *
 * Voting
 * ==================================================================== */
function toggleVote(id, button) {
  if (!state.name) {
    // No name on this phone yet, so there is nothing to vote as.
    openSheet(null);
    showFormError('Add your name and post something first, then you can vote.');
    return;
  }

  var report = findReport(id);
  if (!report) return;

  var voted = button.getAttribute('aria-pressed') === 'true';
  var wanted = !voted;

  // Paint the new state now. An Apps Script round trip takes a second or two and
  // a button that does nothing for that long reads as broken. The refetch below
  // is the real answer; on failure this snaps back.
  applyVoteLocally(report, wanted);
  redrawVote(button, report, wanted);

  // A failed answer is not a failed vote: when the door is slow Google can lose
  // the answer after the row was written (see submitForm). So ask for the truth
  // first, and only snap back when even that cannot be had. refresh never
  // rejects, it just leaves lastLoadedAt alone, so that is the tell.
  apiPost({ action: wanted ? 'vote' : 'unvote', id: id, name: state.name })
    .then(function () { return refresh(); })
    .catch(function () {
      if (state.loading) return;                  // a refresh in flight will bring the truth
      var before = state.lastLoadedAt;
      return refresh().then(function () {
        if (state.lastLoadedAt !== before) return;  // fresh list is on screen, whatever it says
        applyVoteLocally(report, voted);
        redrawVote(button, report, voted);
        showToastError();
      });
    });
}

function applyVoteLocally(report, voted) {
  report.voters = (report.voters || []).filter(function (v) { return !sameName(v, state.name); });
  if (voted) report.voters.push(state.name);
  report.votes = report.voters.length;
}

function redrawVote(button, report, voted) {
  button.setAttribute('aria-pressed', voted ? 'true' : 'false');
  var count = button.querySelector('.count');
  if (count) count.textContent = String(report.votes);
  button.setAttribute('aria-label', (voted ? 'Remove your me too from' : 'Me too on') +
    ' report ' + reportRef(report) + ', ' + report.votes + ' so far');
}

var toastTimer = null;
function showToastError() {
  var list = $('list');
  var existing = document.getElementById('voteToast');
  if (existing) existing.remove();
  var p = stateLine("Couldn't save that. Check your connection.", true);
  p.id = 'voteToast';
  list.insertBefore(p, list.firstChild);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    var node = document.getElementById('voteToast');
    if (node) node.remove();
  }, 4000);
}


/* ==================================================================== *
 * Delete
 * ==================================================================== */
function askDelete(id) {
  var report = findReport(id);
  if (!report) return;
  state.pendingDeleteId = id;
  $('confirmText').textContent = 'Delete ' + reportLabel(report) + "? This can't be undone from here.";
  $('confirmBackdrop').hidden = false;
  $('confirm').hidden = false;
  $('confirmDelete').focus();
}

function closeConfirm() {
  $('confirm').hidden = true;
  $('confirmBackdrop').hidden = true;
  state.pendingDeleteId = null;
}

function doDelete() {
  var id = state.pendingDeleteId;
  if (!id) return;
  $('confirmDelete').disabled = true;
  apiPost({ action: 'delete', id: id, name: state.name })
    .then(function () {
      $('confirmDelete').disabled = false;
      closeConfirm();
      removeReportLocally(id);
      render();
      saveCachedReports(state.reports);
    })
    .catch(function () {
      $('confirmDelete').disabled = false;
      closeConfirm();
      showToastError();
      refresh();   // the delete may well have landed, so let the list settle it
    });
}


/* ==================================================================== *
 * Toolbar
 * ==================================================================== */
function syncToolbar() {
  var chips = $('filters').querySelectorAll('button');
  for (var i = 0; i < chips.length; i++) {
    chips[i].setAttribute('aria-pressed',
      chips[i].getAttribute('data-filter') === state.filter ? 'true' : 'false');
  }
  var sorts = $('sorts').querySelectorAll('button');
  for (var j = 0; j < sorts.length; j++) {
    sorts[j].setAttribute('aria-pressed',
      sorts[j].getAttribute('data-sort') === state.sort ? 'true' : 'false');
  }
}


/* ==================================================================== *
 * Wiring
 * ==================================================================== */
$('openForm').addEventListener('click', function () { openSheet(null); });
$('closeSheet').addEventListener('click', closeSheet);
$('backdrop').addEventListener('click', closeSheet);
$('refresh').addEventListener('click', function () { refresh(); });

$('filters').addEventListener('click', function (e) {
  var button = e.target.closest('button[data-filter]');
  if (!button) return;
  state.filter = button.getAttribute('data-filter');
  syncToolbar();
  render();
});

$('sorts').addEventListener('click', function (e) {
  var button = e.target.closest('button[data-sort]');
  if (!button) return;
  state.sort = button.getAttribute('data-sort');
  syncToolbar();
  render();
});

$('typePicker').addEventListener('click', function (e) {
  var button = e.target.closest('button[data-type]');
  if (!button) return;
  state.type = button.getAttribute('data-type');
  state.level = null;
  syncTypeButtons();
  renderLevels();
  syncSubmit();
});

$('levelPicker').addEventListener('click', function (e) {
  var button = e.target.closest('button[data-level]');
  if (!button) return;
  state.level = button.getAttribute('data-level');
  renderLevels();
  syncSubmit();
});

$('changeName').addEventListener('click', function () {
  state.name = '';
  forgetName();
  $('nameInput').value = '';
  $('changeName').hidden = true;
  $('nameInput').focus();
  syncSubmit();
  render();
});

$('addPic').addEventListener('click', function () { $('picInput').click(); });

$('picInput').addEventListener('change', function (e) {
  addPickedFiles(e.target.files);
  // Cleared so that picking the same file again still fires a change event.
  e.target.value = '';
});

$('picList').addEventListener('click', function (e) {
  var drop = e.target.closest('button[data-drop]');
  if (!drop) return;
  state.images.splice(Number(drop.getAttribute('data-drop')), 1);
  renderImages();
});

$('nameInput').addEventListener('input', syncSubmit);
$('textInput').addEventListener('input', syncSubmit);
$('form').addEventListener('submit', submitForm);

$('list').addEventListener('click', function (e) {
  var voteButton = e.target.closest('button[data-vote]');
  if (voteButton) { toggleVote(Number(voteButton.getAttribute('data-vote')), voteButton); return; }

  var editButton = e.target.closest('button[data-edit]');
  if (editButton) {
    var report = findReport(Number(editButton.getAttribute('data-edit')));
    if (report) openSheet(report);
    return;
  }

  var deleteButton = e.target.closest('button[data-delete]');
  if (deleteButton) askDelete(Number(deleteButton.getAttribute('data-delete')));
});

$('confirmCancel').addEventListener('click', closeConfirm);
$('confirmBackdrop').addEventListener('click', closeConfirm);
$('confirmDelete').addEventListener('click', doDelete);

document.addEventListener('visibilitychange', autoRefresh);
window.addEventListener('online', autoRefresh);

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (!$('confirm').hidden) { closeConfirm(); return; }
  if (!$('sheet').hidden) closeSheet();
});


/* ==================================================================== *
 * Start
 * ==================================================================== */
state.name = loadName();

var cached = loadCachedReports();
if (cached && cached.length) {
  state.reports = cached;
  state.status = 'ready';        // draw it now; the fetch below corrects it
}

syncToolbar();
render();
refresh();
</script>
</body>
</html>
